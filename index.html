<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151618'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23f5c86a'/%3E%3C/svg%3E" />
    <title>拍拍运气拍拍波</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="game-column" aria-label="拍拍运气拍拍波游戏区域">
        <header class="score-strip" aria-live="polite">
          <div class="fighter-status">
            <span class="fighter-name">你</span>
            <span id="player-score" class="score">0</span>
            <span id="player-qi" class="qi-row"></span>
          </div>
          <div class="round-status">
            <span id="beat-text" class="beat-text">第 1 回合</span>
            <span id="enemy-read" class="enemy-read">对手在读你的节奏。</span>
          </div>
          <div class="fighter-status fighter-status--enemy">
            <span id="enemy-qi" class="qi-row"></span>
            <span id="enemy-score" class="score">0</span>
            <span class="fighter-name">AI</span>
          </div>
        </header>

        <div id="game-root" class="game-root" aria-label="游戏画面"></div>

        <section class="action-dock" aria-label="出招">
          <div id="action-buttons" class="action-buttons"></div>
          <button id="reset-button" class="reset-button" type="button">重开</button>
        </section>
      </section>

      <aside class="side-panel" aria-label="规则和战况">
        <div class="rule-box">
          <h1>拍拍运气拍拍波</h1>
          <p>先到 3 分。每回合同时选招：运气攒气，出波抓运气，防御要猜对波的大小。</p>
          <dl>
            <div>
              <dt>1 气</dt>
              <dd>拍拍波，被单手壁挡。</dd>
            </div>
            <div>
              <dt>2 气</dt>
              <dd>超大波，被手刀挡，压过小波。</dd>
            </div>
            <div>
              <dt>3 气</dt>
              <dd>无敌元气弹，防不住。</dd>
            </div>
          </dl>
        </div>
        <ol id="round-log" class="round-log" aria-label="回合记录"></ol>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
